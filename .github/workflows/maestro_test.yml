name: Run Maestro Tests (iOS)

on:
  push:
    branches:
      - testCase
      - feat/test-docker
  pull_request:
    branches:
      - main

jobs:
  setup-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Decode and Export Environment Variables
        run: |
          echo "${{ secrets.ENCODED_ENV_VARS }}" | base64 --decode > .env

      - name: Pull and Run Docker Containers
        run: |
          docker pull testburst/burst-backend-db:latest
          docker pull testburst/burst-backend-backend:latest
          docker network create burst
          docker run -d --name db --network burst -p 5432:5432 \
            --env-file .env \
            -v db_data:/var/lib/postgresql/data \
            testburst/burst-backend-db:latest
          docker run -d --name backend --network burst -p 8080:8080 \
            --env-file .env \
            testburst/burst-backend-backend:latest

  maestro-tests:
    needs: setup-docker
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Decode and Export Environment Variables
        run: |
          echo "${{ secrets.ENCODED_ENV_VARS }}" | base64 --decode > .env

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Maestro
        run: |
          brew install mobile-dev-inc/tap/maestro
          echo 'export PATH="$HOME/.maestro/bin:$PATH"' >> $HOME/.zshrc
          echo 'export PATH="$HOME/.maestro/bin:$PATH"' >> $HOME/.bashrc
          source ~/.zshrc || source ~/.bashrc

      - name: Start iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15 Pro"

      - name: Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Install iOS Dependencies
        run: |
          cd ios
          pod install --verbose
          cd ..

      - name: Build and Launch App
        run: |
          export PATH=$(npm bin):$PATH
          echo "Starting app build..."
          
          # Start app in a new session using tmux (or nohup if tmux isn't available)
          if command -v tmux &> /dev/null; then
            tmux new-session -d -s ios_session "npm run ios"
          else
            nohup npm run ios > ios_build.log 2>&1 &
          fi
          
          # Wait for app to be installed
          MAX_WAIT=300
          COUNTER=0
          while [ $COUNTER -lt $MAX_WAIT ]; do
            if xcrun simctl get_app_container booted "com.mycurio.curio" >/dev/null; then
              echo "✅ App installed successfully"
              break
            fi
            sleep 5
            COUNTER=$((COUNTER + 5))
            echo "Waiting for app to install... ($COUNTER seconds)"
          done
          
          # Verify app is still running
          if ! ps aux | grep "[n]pm run ios"; then
            echo "❌ App build process stopped unexpectedly."
            exit 1
          fi

      - name: Run Maestro Tests
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
          
          for test in e2e/*.yaml; do
            echo "Running test: $test"
            if ! maestro test "$test"; then
              echo "❌ Test failed: $test"
              exit 1  # Stop immediately on failure
            fi
          done

  cleanup-maestro:
    needs: maestro-tests
    if: always()
    runs-on: macos-latest
    steps:
      - name: Shutdown Simulator
        run: |
          xcrun simctl shutdown "iPhone 15 Pro" || true
          xcrun simctl delete "iPhone 15 Pro" || true

  cleanup-docker:
    needs: setup-docker
    if: always()
    runs-on: ubuntu-latest
    steps:
        - name: Stop Docker Containers
          run: |
            docker stop backend db || true
            docker rm backend db || true
            docker network rm burst || true