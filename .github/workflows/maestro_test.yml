name: Run Maestro Tests (iOS)

on:
  push:
    branches:
      - testCase
  pull_request:
    branches:
      - main

jobs:
  maestro-tests:
    runs-on: macos-latest  # Use macOS for iOS Simulator
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Java (Required for Maestro)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Maestro
        run: |
          brew install mobile-dev-inc/tap/maestro
          echo 'export PATH="$HOME/.maestro/bin:$PATH"' >> $HOME/.zshrc
          echo 'export PATH="$HOME/.maestro/bin:$PATH"' >> $HOME/.bashrc
          source ~/.zshrc || source ~/.bashrc

      - name: Verify Maestro Installation
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          which maestro || echo "⚠️ Maestro is not found in PATH!"
          maestro --version

      - name: Install Expo CLI
        run: npm install -g expo

      - name: Find and Start iOS Simulator
        id: simulator
        run: |
          echo "📱 Listing available simulators..."
          xcrun simctl list devices
          
          # Find iPhone 16 simulator
          IPHONE16_INFO=$(xcrun simctl list devices | grep -i 'iPhone 16' | grep -v 'Pro' | grep -v 'Plus' | head -1)
          
          if [ -z "$IPHONE16_INFO" ]; then
            echo "⚠️ iPhone 16 not found, falling back to any available iPhone"
            IPHONE_INFO=$(xcrun simctl list devices | grep -i 'iPhone' | head -1)
          else
            IPHONE_INFO=$IPHONE16_INFO
          fi
          
          # Extract UDID from device info
          UDID=$(echo $IPHONE_INFO | sed -n 's/.*(\([^)]*\)).*/\1/p')
          
          if [ -z "$UDID" ]; then
            echo "❌ No iPhone simulator found!"
            exit 1
          fi
          
          echo "📱 Using simulator with UDID: $UDID"
          echo "udid=$UDID" >> $GITHUB_OUTPUT
          
          echo "📱 Booting Simulator..."
          xcrun simctl boot $UDID || echo "Simulator already booted"

          echo "⏳ Waiting for simulator to be ready..."
          xcrun simctl bootstatus $UDID -b || echo "Simulator is already booted"
          
          echo "✅ Simulator is ready!"

      - name: Install Dependencies
        run: |
          echo "📦 Installing project dependencies..."
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      

      - name: Install iOS Dependencies
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          cd ios
          pod install --verbose
          cd ..

      - name: Build and Install App on iOS Simulator
        id: build_app
        run: |
          echo "📥 Building app for iOS Simulator..."
          export PATH=$(npm bin):$PATH
          
          # Start a background process to build the app
          npm run ios -- --simulator="iPhone 16" &
          IOS_PID=$!
          
          echo "⏳ Waiting for build to start..."
          sleep 60  # Wait for build to get started
          
          # Look for the app bundle after initial wait
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
          
          # If not found, continue waiting with a timeout
          if [ -z "$APP_PATH" ]; then
            echo "⏳ App still building, waiting..."
            MAX_WAIT=900  # 15 minutes max wait
            ELAPSED=60
            
            while [ -z "$APP_PATH" ] && [ $ELAPSED -lt $MAX_WAIT ]; do
              sleep 30
              ELAPSED=$((ELAPSED + 30))
              echo "⏳ Still waiting... ($ELAPSED seconds elapsed)"
              APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
            done
          fi
          
          # Kill the background iOS process once app is built or timeout reached
          kill $IOS_PID || true
          
          if [ -z "$APP_PATH" ]; then
            echo "❌ Failed to find built app after $MAX_WAIT seconds."
            exit 1
          fi
          
          echo "✅ App built successfully at: $APP_PATH"
          
          xcrun simctl install ${{ steps.simulator.outputs.udid }} "$APP_PATH"
          echo "✅ App installed successfully!"
          
          # Store app path for later use
          echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

      - name: Run All Maestro E2E Tests
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=300000  # 5 minutes
          
          # Launch the app before tests
          APP_BUNDLE_ID=$(plutil -convert json -o - ${{ steps.build_app.outputs.app_path }}/Info.plist | jq -r '.CFBundleIdentifier')
          echo "📱 Launching app with bundle ID: $APP_BUNDLE_ID"
          xcrun simctl launch ${{ steps.simulator.outputs.udid }} $APP_BUNDLE_ID
          
          # Sleep to ensure app is fully launched
          sleep 10
          
          echo "🔥 Running Maestro tests..."
          for test in e2e/*.yaml; do
            TEST_NAME=$(basename "$test" .yaml)
            OUTPUT_FILE="e2e/results-${TEST_NAME}.xml"
            
            echo "🔥 Running test: $test"
            # Add -v flag for verbose output
            maestro test -v "$test" --format junit --output "$OUTPUT_FILE"
            
            TEST_RESULT=$?
            if [ $TEST_RESULT -ne 0 ]; then
              echo "❌ Test failed: $test (Exit code: $TEST_RESULT)"
              if [ -f "$OUTPUT_FILE" ]; then
                cat "$OUTPUT_FILE"
              else
                echo "⚠️ No test result file generated for $test"
              fi
              
              # Instead of exiting, capture screenshots for debugging
              xcrun simctl io ${{ steps.simulator.outputs.udid }} screenshot "failure-${TEST_NAME}.png"
              echo "📷 Captured failure screenshot: failure-${TEST_NAME}.png"
              
              # Continue to next test rather than exiting
              continue
            fi
            
            echo "✅ Test passed: $test"
          done