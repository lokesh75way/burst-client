name: Run Maestro Tests (iOS)

on:
  push:
    branches:
      - testCase
      - feat/test-docker
  pull_request:
    branches:
      - main

jobs:
  maestro-tests:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Decode and Export Environment Variables
        run: |
          echo "${{ secrets.ENCODED_ENV_VARS }}" | base64 --decode > .env
          # Get the host's IP address
          HOST_IP=$(ipconfig getifaddr en0 || ipconfig getifaddr en1)
          echo "Detected host IP: $HOST_IP"
          # Update Expo public URLs
          sed -i '' "s|EXPO_PUBLIC_API_URL=.*|EXPO_PUBLIC_API_URL=http://$HOST_IP:8080/api/v1/|" .env
          sed -i '' "s|EXPO_PUBLIC_IMAGE_URL=.*|EXPO_PUBLIC_IMAGE_URL=http://$HOST_IP:8080/|" .env
          echo "Modified environment variables:"
          grep "EXPO_PUBLIC_" .env

      - name: Setup Docker on macOS
        uses: douglascamata/setup-docker-macos-action@v1-alpha
        with:
          wait-for-daemon: true

  
      - name: Pull and Run Docker Containers
        run: |
          docker pull testburst/burst-backend-db:latest
          docker pull testburst/burst-backend-backend:latest
          docker network create burst
          docker run -d --name db --network burst -p 5432:5432 \
            --env-file .env \
            -v db_data:/var/lib/postgresql/data \
            testburst/burst-backend-db:latest
          docker run -d --name backend --network burst -p 8080:8080 \
            --env-file .env \
            -e API_BIND=0.0.0.0 \
            testburst/burst-backend-backend:latest

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Install Maestro
        run: |
          brew install mobile-dev-inc/tap/maestro
          echo 'export PATH="$HOME/.maestro/bin:$PATH"' >> $HOME/.zshrc
          echo 'export PATH="$HOME/.maestro/bin:$PATH"' >> $HOME/.bashrc
          source ~/.zshrc || source ~/.bashrc

      - name: Start iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15 Pro"

      - name: Install Dependencies
        run: |
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps

      - name: Install iOS Dependencies
        run: |
          cd ios
          pod install --verbose
          cd ..

      - name: Build and Install App (Release Mode)
        run: |
          cd ios
          cd ..
          npx react-native run-ios --configuration Release --no-packager
          echo "✅ App launched successfully with API URL: $(grep 'EXPO_PUBLIC_API_URL' .env | cut -d '=' -f2)"

      - name: Run Maestro Tests
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
          
          for test in e2e/*.yaml; do
            echo "Running test: $test"
            if ! maestro test "$test"; then
              echo "❌ Test failed: $test"
              exit 1
            fi
          done

      - name: Cleanup
        if: always()
        run: |
          xcrun simctl shutdown "iPhone 15 Pro" || true
          xcrun simctl delete "iPhone 15 Pro" || true
          docker stop backend db || true
          docker rm backend db || true
          docker network rm burst || true