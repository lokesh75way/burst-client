name: Run Maestro Tests (iOS)

on:
  push:
    branches:
      - testCase
      - feat/test-docker
  pull_request:
    branches:
      - main

jobs:
  maestro-tests:
    runs-on: macos-latest  # Use macOS for iOS Simulator
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Decode and Export Environment Variables
        run: |
          echo "${{ secrets.ENCODED_ENV_VARS }}" | base64 --decode > .env
          cat .env  # Debugging, remove in production
      - name: Install Docker
        run: |
          brew install --cask docker
          open /Applications/Docker.app || echo "Docker UI may need manual launch"
          sleep 10

      - name: Start Docker
        run: |
          osascript -e 'tell application "Docker" to activate'
          sleep 15 

      - name: Verify Docker Installation
        run: docker --version

      - name: Pull and Run Docker Containers
        run: |
          echo "🚀 Pulling Docker images...."
          docker pull testburst/burst-backend-db:latest
          docker pull testburst/burst-backend-backend:latest

          echo "🔧 Running Docker containers..."
          docker network create burst

          docker run -d --name db --network burst -p 5432:5432 \
            --env-file .env \
            -v db_data:/var/lib/postgresql/data \
            testburst/burst-backend-db:latest
          
          docker run -d --name backend --network burst -p 8080:8080 \
            --env-file .env \
            testburst/burst-backend-backend:latest

          echo "✅ Containers are running!"

      - name: Set up Java (Required for Maestro)
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'

      - name: Verify Java Installation
        run: java -version

      - name: Install Maestro
        run: |
          brew install mobile-dev-inc/tap/maestro
          echo 'export PATH="$HOME/.maestro/bin:$PATH"' >> $HOME/.zshrc
          echo 'export PATH="$HOME/.maestro/bin:$PATH"' >> $HOME/.bashrc
          source ~/.zshrc || source ~/.bashrc
      - name: Verify Maestro Installation
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          which maestro || echo "⚠️ Maestro is not found in PATH!"
          maestro --version
      - name: Install Expo CLI
        run: npm install -g expo

      - name: Start iOS Simulator
        run: |
          UDID="D14D5D76-4DF8-4504-A8F0-418CB68A75E5"
          echo "📱 Booting Simulator..."
          xcrun simctl boot $UDID || echo "Simulator already booted"
          echo "⏳ Waiting for simulator to be ready..."
          xcrun simctl bootstatus $UDID -b || echo "Simulator is already booted"
          
          echo "✅ Simulator is ready!"
          xcrun simctl list devices
      - name: Install Dependencies
        run: |
          echo "📦 Installing project dependencies..."
          rm -rf node_modules package-lock.json
          npm install --legacy-peer-deps
      - name: Install iOS Dependencies
        run: |
          echo "📦 Installing CocoaPods dependencies..."
          cd ios
          pod install --verbose
          cd ..
      # - name: Install App on iOS Simulator
      #   run: |
      #     echo "📥 Installing app on iOS Simulator..."
      #     export PATH=$(npm bin):$PATH
          
      #     npm run ios || echo "⚠️ Failed to install via npm, trying manually..."

      #     # Locate the built app
      #     APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" | head -n 1)
      #     if [ -z "$APP_PATH" ]; then
      #       echo "❌ App build failed. Check logs."
      #       exit 1
      #     fi
          
      #     UDID="D14D5D76-4DF8-4504-A8F0-418CB68A75E5"
      #     xcrun simctl install $UDID "$APP_PATH"
      #     echo "✅ App installed successfully!"
      - name: Install App on iOS Simulator
        run: |
          echo "📥 Installing app on iOS Simulator..."
          export PATH=$(npm bin):$PATH
          
          # Run the build in the background
          npm run ios &
          NPM_PID=$!
          
          # Wait for the specific log message or a timeout
          echo "⏳ Waiting for the app to open in the simulator..."
          MAX_WAIT_TIME=1000  # 20 minutes
          INTERVAL=10
          TIME_ELAPSED=0
          while [ $TIME_ELAPSED -lt $MAX_WAIT_TIME ]; do
            if grep -q "Opening the iOS simulator, this might take a moment." <(npm logs); then
              echo "✅ Simulator opening detected."
              break
            fi
            echo "⏳ Still waiting... ($TIME_ELAPSED seconds elapsed)"
            sleep $INTERVAL
            TIME_ELAPSED=$((TIME_ELAPSED + INTERVAL))
          done
          
          # Send SIGINT to the npm process
          echo "🛑 Stopping the npm process..." 
          kill -SIGINT $NPM_PID
          
          # Wait for the process to exit
          wait $NPM_PID
          
          # Continue with the rest of the steps
          echo "✅ App installation process stopped, continuing with Maestro tests..."

      - name: Debug iOS & Maestro Setup
        run: |
          echo "🔍 Checking Xcode installation..."
          xcode-select -p || echo "❌ Xcode CLI tools not found!"
          echo "🔍 Checking Maestro installation..."
          which maestro || echo "❌ Maestro not found!"
          maestro --version
      # - name: Run All Maestro E2E Tests
      #   run: |
      #     export PATH="$HOME/.maestro/bin:$PATH"
      #     export MAESTRO_DRIVER_STARTUP_TIMEOUT=300000  # 5 minutes
          
      #     for test in e2e/*.yaml; do
      #       TEST_NAME=$(basename "$test" .yaml)
      #       OUTPUT_FILE="e2e/results-${TEST_NAME}.xml"
            
      #       echo "🔥 Running test: $test"
      #       maestro test "$test" --format junit --output "$OUTPUT_FILE"
      #       if [ $? -ne 0 ]; then
      #         echo "❌ Test failed: $test"
      #         if [ -f "$OUTPUT_FILE" ]; then
      #           cat "$OUTPUT_FILE"
      #         else
      #           echo "⚠️ No test result file generated for $test"
      #         fi
      #         exit 1
      #       fi
      #     done

      - name: Run All Maestro E2E Tests
        run: |
          export PATH="$HOME/.maestro/bin:$PATH"
          export MAESTRO_DRIVER_STARTUP_TIMEOUT=300000  # 5 minutes

          ALL_TESTS_PASSED=true

          for test in e2e/*.yaml; do
            TEST_NAME=$(basename "$test" .yaml)
            OUTPUT_FILE="e2e/results-${TEST_NAME}.xml"

            echo "🔥 Running test: $test"
            maestro test "$test" --format junit --output "$OUTPUT_FILE"
            
            if [ $? -ne 0 ]; then
              echo "❌ Test failed: $test"
              if [ -f "$OUTPUT_FILE" ]; then
                cat "$OUTPUT_FILE"
              else
                echo "⚠️ No test result file generated for $test"
              fi
              ALL_TESTS_PASSED=false
            fi
          done

          if [ "$ALL_TESTS_PASSED" = false ]; then
            echo "❌ Some tests failed. Check logs."
            exit 1
          else
            echo "✅ ALL TEST CASES RAN SUCCESSFULLY!"
          fi