appId: "com.mycurio.curio"
---
- launchApp
- waitForAnimationToEnd
- assertVisible: "Login"

- tapOn:
      point: "24%,52%"
- inputText: "mabel@yopmail.com"
- tapOn:
      point: "38%,41%"
- inputText: "Test@123"
- tapOn: "Login"

- waitForAnimationToEnd
- tapOn:
      id: "create-post-tab-icon"
- tapOn: "What's on your mind?"
- inputText: "testing tag notification @oli"
- "hideKeyboard"
- tapOn: "Oli"
- tapOn: "Post"
- waitForAnimationToEnd
- waitForAnimationToEnd
- tapOn:
      id: "profile-nav-icon"
- tapOn:
      id: "profile-more"
- tapOn: "Logout"
- tapOn: "Logout"

- assertVisible: "Login"

- tapOn:
      point: "24%,52%"
- inputText: "olman@yopmail.com"
- tapOn:
      point: "38%,41%"
- inputText: "Test@1234"
- tapOn: "Login"

- waitForAnimationToEnd

- tapOn:
