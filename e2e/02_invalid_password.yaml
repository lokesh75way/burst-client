appId: "com.mycurio.curio"
---
- launchApp
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "My text that should be visible" # or any other selector
    timeout: 160000 

# # Wait for screen to load
# - waitForAnimationToEnd

# Tap on Email field and enter text
- tapOn:
    point: 14%,51%
- inputText: "mabel@yopmail.com"

# Tap outside to dismiss keyboard
- tapOn:
    point: 12%,29%

# Tap on Password field and enter text
- tapOn:
    point: 12%,59%
- inputText: "invalid_password"

# Tap on Login button
- tapOn: "Login"



# Stop the app
- stopApp: "com.mycurio.curio"


# Relaunch the app
- launchApp